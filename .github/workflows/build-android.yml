name: Build Android client

on:
  push:
    paths:
      - "android-client/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages: ''` stops the action installing its obsolete default package set (which fails);
      # we install exactly what the build needs below.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E -A3 "^e: |error:|What went wrong|Execution failed|FAILURE" build.log | head -80 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clouddroid-debug-apk
          path: android-client/app/build/outputs/apk/debug/*.apk
