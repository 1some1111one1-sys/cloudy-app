name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine_ref:
        description: "NewBlackbox commit to build against"
        required: false
        default: "89b59836c66f173756a4ae258cf379a957649820"

permissions:
  contents: write

env:
  # Engine commit this overlay was written against.
  DEFAULT_ENGINE_REF: "89b59836c66f173756a4ae258cf379a957649820"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK platform, build tools and NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Fetch the engine
        run: |
          REF="${{ github.event.inputs.engine_ref }}"
          REF="${REF:-$DEFAULT_ENGINE_REF}"
          mkdir engine
          cd engine
          git init -q
          git remote add origin https://github.com/ALEX5402/NewBlackbox.git
          git fetch --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD

      - name: Apply overlay
        run: python3 scripts/apply_overlay.py engine

      - name: Build debug APKs
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p out
          find engine/app/build/outputs/apk/debug -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bg-app-runner-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "BG App Runner build ${{ github.run_number }}" \
            --notes "Debug-signed APKs. Use the arm64-v8a file on most phones."
